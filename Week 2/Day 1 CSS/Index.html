<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Hero Section Making | Practice </title>



    <!-- CSS Styling start from Here -->
    <style>
        /* for whole page  */
        * {
            margin: 0;
            padding: 0;
                    }


                    
        /* hero section container  */

        #heroimage {
 
            /* linear gradient google se search kr k nikala hy. bg ko black shadow krne k lye */
  
            height: 100vh;
            width: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), url(https://www.esi-ski.com/media/cache/cover_site_content/2021/10/8065-sunset-at-mount-fitzroy-patagonia.jpg.webp);
            background-size: cover;
            background-position: top;
 
        }

        #herocontent{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 2rem;
            padding-top: 15rem;
            padding-left: 5rem;
            color: white;
        }

        #herobutton{
            margin-left: 5rem;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 2rem;
            padding: 1rem;
            border-radius: 2rem;
            font-weight: bold;
            background-color: #007acc;
            color: white;
        }

    </style>

</head>


<!-- inline css -->

<body>


    <section id="heroimage">

        <div id="herocontent">
            <h1>Explor <br> Northern Pakistan </h1>
        </div>
        <button id="herobutton">Explor Now <i class="ri-arrow-right-line"></i> </button>

    </section>








</body>

</html>
