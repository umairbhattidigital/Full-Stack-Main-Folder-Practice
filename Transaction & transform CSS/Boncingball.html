<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Bouncing Ball</title>
    <style>
        /* Center the ball on the screen */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f3f5;
        }

        /* Container to define the bouncing area */
        .stage {
            width: 200px;
            height: 300px;
            display: flex;
            align-items: flex-end; /* Starts the ball at the bottom */
            justify-content: center;
            border-bottom: 4px solid #333; /* The "floor" */
        }

        /* The Ball */
        .ball {
            width: 50px;
            height: 50px;
            background-color: #ff4757;
            border-radius: 50%; /* Makes it circular */
            
            /* Animation properties */
            animation: bounce 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate;
        }

        /* Bouncing Effect using Keyframes */
        @keyframes bounce {
            0% {
                transform: translateY(0) scaleY(1); /* On the floor */
            }
            100% {
                transform: translateY(-200px) scaleY(1); /* Peak of the bounce */
            }
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="ball"></div>
    </div>

</body>
</html>
